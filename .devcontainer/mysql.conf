# MySQL 8.0 Configuration for CIS 047 Course
# This configuration file optimizes MySQL for development and course use

[mysqld]

# Network and Connection Settings
port = 3306
bind-address = 0.0.0.0
max_connections = 1000
max_allowed_packet = 256M

# Database Settings
default-storage-engine = InnoDB
character-set-server = utf8mb4
collation-server = utf8mb4_unicode_ci

# InnoDB Settings
innodb_buffer_pool_size = 256M
innodb_log_file_size = 100M
innodb_file_per_table = 1
innodb_flush_method = O_DIRECT

# Performance Settings
slow_query_log = 1
slow_query_log_file = /var/log/mysql/slow.log
long_query_time = 2

# Logging
general_log = 0
general_log_file = /var/log/mysql/general.log
log_error = /var/log/mysql/error.log

# Query Cache (disabled in MySQL 8.0+)
query_cache_type = 0
query_cache_size = 0

# Binary Logging (optional, useful for replication/backup)
log_bin = /var/log/mysql/mysql-bin
expire_logs_days = 7

# SQL Mode
sql_mode = "STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"

# Default Authentication Plugin (MySQL 8.0)
default_authentication_plugin = mysql_native_password

# Client Settings
[client]
port = 3306
user = root

# MySQL Client Settings
[mysql]
no-auto-rehash

# mysqldump Settings
[mysqldump]
quick
quote-names
max_allowed_packet = 256M
