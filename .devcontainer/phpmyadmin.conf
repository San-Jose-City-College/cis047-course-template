# phpMyAdmin aliases
Alias /phpMyAdmin /usr/share/phpmyadmin
Alias /phpmyadmin /usr/share/phpmyadmin

# Allow access to phpMyAdmin
<Directory /usr/share/phpmyadmin>
    Options FollowSymLinks
    DirectoryIndex index.php
    Require all granted
</Directory>

# Preserve the original hostname and HTTPS scheme
# when redirecting requests missing the trailing slash
RedirectRelative On

# Redirect /phpMyAdmin to /phpMyAdmin/
RedirectMatch 302 ^/phpMyAdmin$ /phpMyAdmin/

# Also support the lowercase version
RedirectMatch 302 ^/phpmyadmin$ /phpmyadmin/
