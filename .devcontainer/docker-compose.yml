version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "3000:3000"
    volumes:
      - ..:/workspaces/cis047-course-template
    environment:
      - APACHE_DOCUMENT_ROOT=/workspaces/cis047-course-template/public
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=cis047_course
      - MYSQL_USER=cis047_user
      - MYSQL_PASSWORD=cis047_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data:
